//                               onEnd() {}, onSfx(name) {} });
//   每帧：cs.update(dtMs); cs.draw();   点屏幕：cs.skip();
// 时间线格式见 00_过场动画制作_技能_1.0.md 第 5 节。
(function (root) {
  'use strict';

  // ---------- 缓动 ----------
  const EASE = {
    linear: t => t,
    in: t => t * t,
    out: t => 1 - (1 - t) * (1 - t),
    inOut: t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
    sine: t => 0.5 - 0.5 * Math.cos(Math.PI * t),
    step: t => (t < 1 ? 0 : 1),
    pop: t => { const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }, // 弹过头再回来
  };
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;

  // 一些随机数要可重复（同一段过场每次播一样），用固定种子
  function rng(seed) {
    let s = seed >>> 0 || 1;
    return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  }

  // ---------- 粒子预设 ----------
  const PARTICLE = {
    spark:  { colors: ['#FFE07A', '#FFB030', '#FF7A1A'], speed: [3, 9], gravity: 0.25, life: [18, 36], size: [2, 3.5], shape: 'line' },
    debris: { colors: ['#9A9A9A', '#6E6E6E', '#C8C0B0'], speed: [3, 8], gravity: 0.35, life: [40, 70], size: [3, 6], shape: 'rect' },
    hearts: { colors: ['#FF5A7A', '#FFFFFF', '#E8204A'], speed: [0.4, 1.2], gravity: -0.02, life: [90, 150], size: [8, 16], shape: 'heart', area: true },
    bokeh:  { colors: ['#FFFFFF', '#FFE0F0', '#FFF4C0'], speed: [0.2, 0.6], gravity: -0.01, life: [80, 140], size: [6, 18], shape: 'dot', area: true, alpha: 0.5 },
    dust:   { colors: ['#FFFFFF'], speed: [0.2, 0.8], gravity: 0, life: [60, 120], size: [1.5, 3], shape: 'dot', area: true, alpha: 0.6 },
  };

  function createCutscene(opts) {
    const ctx = opts.ctx;
    const W = opts.width, H = opts.height;
    const tl = opts.timeline;
    const fps = tl.fps || 60;
    const images = opts.images || {};
    const onEnd = opts.onEnd || (() => {});
    const onSfx = opts.onSfx || (() => {});
    const rand = rng(tl.seed || 7);

    // 短版（第二次起播）：从 short.from 开始，去掉 short.drop 里的节拍，short.dur 里的节拍改时长
    const S = opts.short ? (tl.short || (tl.shortFrom ? { from: tl.shortFrom } : null)) : null;
    let defs = tl.beats, pre = [];
    if (S) {
      const i0 = Math.max(0, tl.beats.findIndex(b => b.id === S.from));
      pre = tl.beats.slice(0, i0);
      defs = tl.beats.slice(i0).filter(b => !(S.drop || []).includes(b.id))
        .map(b => (S.dur && S.dur[b.id] ? Object.assign({}, b, { dur: S.dur[b.id], repeat: 1 }) : b));
    }

    // 把 repeat 展开成平铺的节拍表，记下每个节拍的起始帧
    const beats = [];
    let total = 0;
    for (const b of defs) {
      const n = b.repeat || 1;
      for (let k = 0; k < n; k++) {
        beats.push({ def: b, start: total, k });
        total += b.dur;
      }
    }

    // 图层状态
    const layers = {};
    const base = {};
    for (const L of tl.layers) {
      const s = {
        id: L.id, img: L.img, z: L.z || 0, anchor: L.anchor || [0.5, 0.5], fit: L.fit || null,
        x: (L.pos || [0.5, 0.5])[0], y: (L.pos || [0.5, 0.5])[1], h: L.h || 0.5,
        scale: 1, sx: 1, sy: 1, alpha: L.alpha == null ? 1 : L.alpha, rot: 0,
        visible: L.visible !== false, flipX: false, smear: null,
      };
      layers[L.id] = s;
      base[L.id] = Object.assign({}, s);
    }

    let frame = 0;          // 当前帧
    let acc = 0;            // 毫秒累计
    let done = false;
    let beatIdx = -1;
    const active = [];      // 正在播的特效
    const tracks = [];      // 正在走的补间
    let cycle = null;       // 连打
    // ox/oy：镜头在大图上平移（单位＝屏宽/屏高），pan：正在走的平移
    const cam = { scale: 1, fx: 0.5, fy: 0.5, anim: null, ox: 0, oy: 0, pan: null };

    // ---------- 节拍进入：起补间、换图、开特效 ----------
    function enterBeat(i, silent) {
      const { def, start } = typeof i === 'number' ? beats[i] : i;
      if (def.reset) resetToBase(def.reset);
      for (const t of def.tracks || []) {
        const L = layers[t.layer];
        if (!L) continue;
        const from = t.from == null ? L[t.prop] : t.from;
        tracks.push({ L, prop: t.prop, from, to: t.to, start: start + (t.at || 0), dur: t.dur || def.dur,
                      ease: t.ease || 'linear', yoyo: t.ease === 'breathe' });
      }
      cycle = def.cycle ? Object.assign({ start, last: -1, order: [] }, def.cycle) : null;
      if (silent) {
        // 短版快进：只落最终状态，不放特效
        for (const f of def.frames || []) applyFrame(f);
        for (const t of tracks) if (t.prop !== 'scale' || !t.yoyo) t.L[t.prop] = t.yoyo ? t.from : t.to;
        tracks.length = 0;
        if (def.camera) cam.scale = def.camera.to || 1;
        return;
      }
    }

    function resetToBase(mode) {
      // 反差回落：所有特效同帧清零，回到第一张图
      active.length = 0;
      tracks.length = 0;
      cycle = null;
      cam.scale = 1; cam.anim = null; cam.fx = 0.5; cam.fy = 0.5; cam.ox = 0; cam.oy = 0; cam.pan = null;
      if (mode === 'all' || mode === true) {
        for (const id in layers) Object.assign(layers[id], base[id]);
      }
    }

    function applyFrame(f) {
      const L = layers[f.layer];
      if (!L) return;
      if (f.img) L.img = f.img;
      if (f.visible != null) L.visible = f.visible;
      if (f.flipX != null) L.flipX = f.flipX;
      if (f.pos) { L.x = f.pos[0]; L.y = f.pos[1]; }
      if (f.alpha != null) L.alpha = f.alpha;
      if (f.scale != null) L.scale = f.scale;
      L.smear = f.smear || null;
    }

    function startFx(spec, beatStart) {
      const fx = Object.assign({}, spec, { t0: beatStart + (spec.at || 0) });
      switch (fx.fx) {
        case 'particles': {
          const P = PARTICLE[fx.preset] || PARTICLE.spark;
          fx.parts = [];
          const n = fx.n || 20;
          const ox = (fx.origin || [0.5, 0.5])[0] * W, oy = (fx.origin || [0.5, 0.5])[1] * H;
          for (let k = 0; k < n; k++) {
            const a = fx.angle != null ? fx.angle + (rand() - 0.5) * (fx.spread || Math.PI * 2)
                                       : rand() * Math.PI * 2;
            const sp = lerp(P.speed[0], P.speed[1], rand());
            fx.parts.push({
              x: P.area ? rand() * W : ox, y: P.area ? rand() * H : oy,
              vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (P.area ? 0 : 1.5),
              life: Math.round(lerp(P.life[0], P.life[1], rand())), size: lerp(P.size[0], P.size[1], rand()),
              color: P.colors[(rand() * P.colors.length) | 0], rot: rand() * 6.28, vr: (rand() - 0.5) * 0.4,
            });
          }
          fx.P = P;
          fx.dur = fx.dur || Math.max(...fx.parts.map(p => p.life));
          break;
        }
        case 'camera':
          if (fx.steps || fx.to != null)
            cam.anim = { t0: fx.t0, steps: fx.steps, stepDur: fx.stepDur || 3, from: cam.scale, to: fx.to,
                         dur: fx.dur || 0, ease: fx.ease || (fx.steps ? 'step' : 'out') };
          if (fx.focus) { cam.fx = fx.focus[0]; cam.fy = fx.focus[1]; }
          // 运镜：镜头框在大图上移动。pan:[x,y] 是镜头中心偏离屏幕中心多少（屏宽/屏高为单位）；
          // panDur 为 0 就是硬切到那一块（Flash 式「啪」地切过去）
          if (fx.pan) {
            const pd = fx.panDur != null ? fx.panDur : (fx.dur || 0);
            if (pd > 0) cam.pan = { t0: fx.t0, from: [cam.ox, cam.oy], to: fx.pan, dur: pd, ease: fx.panEase || 'inOut' };
            else { cam.ox = fx.pan[0]; cam.oy = fx.pan[1]; cam.pan = null; }
          }
          return; // 不进 active
        case 'sfx':
          onSfx(fx.name);
          return;
      }
      if (fx.fx === 'speedlines' || fx.fx === 'rays') fx.seed = (rand() * 1e9) | 0;
      active.push(fx);
    }

    // ---------- 每帧推进 ----------
    function stepFrame() {
      // 进入新节拍
      while (beatIdx + 1 < beats.length && frame >= beats[beatIdx + 1].start) {
        beatIdx++;
        enterBeat(beatIdx, false);
      }
      const b = beats[beatIdx];
      if (b) {
        const local = frame - b.start;
        for (const f of b.def.frames || []) if (f.f === local) applyFrame(f);
        for (const s of b.def.fx || []) {
          if ((s.at || 0) === local) {
            if (s.sfx) onSfx(s.sfx);
            if (s.fx) startFx(s, b.start);
          }
        }
        if (cycle) stepCycle(local);
      }
      // 补间
      for (let i = tracks.length - 1; i >= 0; i--) {
        const t = tracks[i];
        const p = (frame - t.start) / t.dur;
        if (p < 0) continue;
        if (t.yoyo) { t.L[t.prop] = lerp(t.from, t.to, 0.5 - 0.5 * Math.cos(Math.PI * 2 * p)); if (p >= 1) t.L[t.prop] = t.from; }
        else t.L[t.prop] = lerp(t.from, t.to, (EASE[t.ease] || EASE.linear)(clamp(p, 0, 1)));
        if (p >= 1) tracks.splice(i, 1);
      }
      // 镜头
      if (cam.anim) {
        const a = cam.anim, lt = frame - a.t0;
        if (a.steps) {
          const k = Math.min(Math.floor(lt / a.stepDur), a.steps.length - 1);
          if (lt >= 0) cam.scale = a.steps[k];
          if (lt >= a.steps.length * a.stepDur) cam.anim = null;
        } else if (a.dur) {
          cam.scale = lerp(a.from, a.to, (EASE[a.ease] || EASE.out)(clamp(lt / a.dur, 0, 1)));
          if (lt >= a.dur) cam.anim = null;
        } else { cam.scale = a.to; cam.anim = null; }
      }
      if (cam.pan) {
        const a = cam.pan, p = clamp((frame - a.t0) / a.dur, 0, 1), e = (EASE[a.ease] || EASE.inOut)(p);
        cam.ox = lerp(a.from[0], a.to[0], e); cam.oy = lerp(a.from[1], a.to[1], e);
        if (p >= 1) cam.pan = null;
      }
      // 粒子物理、过期特效
      for (let i = active.length - 1; i >= 0; i--) {
        const fx = active[i];
        const lt = frame - fx.t0;
        if (fx.parts) for (const p of fx.parts) { p.x += p.vx; p.y += p.vy; p.vy += fx.P.gravity; p.rot += p.vr; p.vx *= 0.985; }
        const life = fxLife(fx);
        if (life != null && lt > life) active.splice(i, 1);
      }
      frame++;
      if (frame >= total && !done) finish();
    }

    function fxLife(fx) {
      switch (fx.fx) {
        case 'flash': return (fx.hold || 0) + (fx.decay || 15);
        case 'shake': return fx.dur || 8;
        case 'star': return fx.dur || 14;
        case 'sweat': return fx.dur || 50;
        default: return fx.dur == null ? null : fx.dur;   // null = 一直到节拍被 reset 或过场结束
      }
    }

    function stepCycle(local) {
      const c = cycle;
      const slot = Math.floor(local / (c.every || 3));
      if (slot === c.last) return;
      c.last = slot;
      const L = layers[c.layer];
      if (!L) return;
      // 乱序但不连着两次同一张；镜像和小位移冒充更多张
      let k;
      do { k = (rand() * c.imgs.length) | 0; } while (c.imgs.length > 1 && c.imgs[k] === L.img);
      L.img = c.imgs[k];
      L.flipX = c.mirror ? rand() < 0.4 : false;
      const j = c.jitter || 0;
      L.x = (c.pos || base[c.layer].pos || [base[c.layer].x, base[c.layer].y])[0] + (rand() - 0.5) * j * 2;
      L.y = (c.pos || [base[c.layer].x, base[c.layer].y])[1] + (rand() - 0.5) * j;
    }

    function finish() {
      done = true;
      onEnd();
    }

    // ---------- 绘制 ----------
    function drawLayer(L) {
      if (!L.visible || L.alpha <= 0) return;
      const img = images[L.img];
      if (!img) return;
      ctx.save();
      ctx.globalAlpha = clamp(L.alpha, 0, 1);
      let dw, dh;
      if (L.fit === 'cover') {
        const s = Math.max(W / img.width, H / img.height) * L.scale;
        dw = img.width * s; dh = img.height * s;
      } else {
        dh = L.h * H * L.scale; dw = dh * img.width / img.height;
      }
      const px = L.x * W, py = L.y * H;
      ctx.translate(px, py);
      if (L.rot) ctx.rotate(L.rot);
      let sx = L.sx * (L.flipX ? -1 : 1), sy = L.sy;
      if (L.smear) {
        // 抹帧：拉伸 + 速度线，不用另外出图
        sx *= L.smear.sx || 2.4; sy *= L.smear.sy || 0.8;
        drawSmearLines(L, dw, dh);
      }
      ctx.scale(sx, sy);
      ctx.drawImage(img, -dw * L.anchor[0], -dh * L.anchor[1], dw, dh);
      ctx.restore();
    }

    function drawSmearLines(L, dw, dh) {
      const n = L.smear.lines || 8;
      const dir = L.smear.dir || 1;          // 1 = 从左往右冲，速度线留在左边
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.strokeStyle = L.smear.color || '#FFFFFF';
      ctx.lineWidth = 2;
      const r = rng(frame * 31 + 5);
      for (let k = 0; k < n; k++) {
        const y = (r() - 0.5) * dh * 0.9 - dh * (L.anchor[1] - 0.5);
        const len = dw * (0.8 + r() * 1.4);
        ctx.beginPath();
        ctx.moveTo(-dir * dw * 0.4, y);
        ctx.lineTo(-dir * (dw * 0.4 + len), y);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 世界里的特效（跟镜头一起缩放），按 z 插进图层之间
    function drawWorldFx(fx) {
      const lt = frame - fx.t0;
      const o = fx.origin || [0.5, 0.5];
      const ox = o[0] * W, oy = o[1] * H;
      ctx.save();
      switch (fx.fx) {
        case 'glow': {     // 聚能：光点由小变大
          const p = clamp(lt / (fx.grow || fx.dur || 40), 0, 1);
          const r = lerp(fx.r0 || 4, fx.r1 || 60, EASE.in(p)) * (1 + 0.08 * Math.sin(lt * 0.9));
          const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, r);
          g.addColorStop(0, '#FFFFFF'); g.addColorStop(0.3, fx.color || '#9FF4FF'); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ox, oy, r, 0, 6.29); ctx.fill();
          break;
        }
        case 'rays': {     // 放射光柱，慢转
          const n = fx.n || 12, len = Math.max(W, H) * 1.2;
          const a0 = lt * (fx.spin == null ? 0.004 : fx.spin);
          const fade = fx.fadeIn ? clamp(lt / fx.fadeIn, 0, 1) : 1;
          ctx.globalAlpha = (fx.alpha || 0.35) * fade;
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = fx.color || '#FFD27A';
          for (let k = 0; k < n; k++) {
            const a = a0 + k * Math.PI * 2 / n, w = (fx.width || 0.09);
            ctx.beginPath(); ctx.moveTo(ox, oy);
            ctx.lineTo(ox + Math.cos(a - w) * len, oy + Math.sin(a - w) * len);
            ctx.lineTo(ox + Math.cos(a + w) * len, oy + Math.sin(a + w) * len);
            ctx.closePath(); ctx.fill();
          }
          break;
        }
        case 'speedlines': {   // 集中线：从四周指向中心，每 2 帧换一次
          const r = rng(fx.seed + Math.floor(lt / 2));
          const n = fx.n || 40, R = Math.hypot(W, H) * 0.6;
          ctx.strokeStyle = fx.color || '#FFFFFF';
          ctx.globalAlpha = fx.alpha || 0.8;
          for (let k = 0; k < n; k++) {
            const a = r() * Math.PI * 2, inner = R * (fx.inner || 0.45) * (0.8 + r() * 0.4);
            ctx.lineWidth = 1 + r() * 2.5;
            ctx.beginPath();
            ctx.moveTo(ox + Math.cos(a) * inner, oy + Math.sin(a) * inner);
            ctx.lineTo(ox + Math.cos(a) * R * 1.4, oy + Math.sin(a) * R * 1.4);
            ctx.stroke();
          }
          break;
        }
        case 'ring': {     // 光环：绕物体扫一圈；expand = 最后一圈扩出画面
          const dur = fx.dur || 30, p = clamp(lt / dur, 0, 1);
          let rx = (fx.rx || 0.42) * W, ry = (fx.ry || 0.09) * H;
          if (fx.expand) { const e = 1 + EASE.in(p) * 3.5; rx *= e; ry *= e; }
          const head = -Math.PI / 2 + p * Math.PI * 2 * (fx.expand ? 0.6 : 1);
          ctx.globalCompositeOperation = 'lighter';
          ctx.lineCap = 'round';
          for (let k = 0; k < 14; k++) {     // 一条带尾巴的弧
            const a1 = head - k * 0.12, a2 = head - (k + 1) * 0.12;
            ctx.globalAlpha = (1 - k / 14) * (fx.expand ? 1 - p * 0.6 : 1);
            ctx.strokeStyle = k < 2 ? '#FFFFFF' : (fx.color || '#5FD0FF');
            ctx.lineWidth = (fx.width || 6) * (1 - k / 20);
            ctx.beginPath(); ctx.ellipse(ox, oy, rx, ry, 0, a2, a1); ctx.stroke();
          }
          if (fx.expand) { ctx.globalAlpha = 0.5 * (1 - p); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.ellipse(ox, oy, rx, ry, 0, 0, 6.29); ctx.stroke(); }
          break;
        }
        case 'star': {     // 命中星形：黄色尖角，0.6 → 1.1 后消失
          const dur = fx.dur || 14, p = clamp(lt / dur, 0, 1);
          const R = (fx.size || 0.08) * W * lerp(0.6, 1.1, EASE.out(p));
          ctx.globalAlpha = p > 0.7 ? (1 - p) / 0.3 : 1;
          ctx.fillStyle = fx.color || '#FFE24A'; ctx.strokeStyle = '#3A2A00'; ctx.lineWidth = 2;
          ctx.beginPath();
          const n = fx.points || 9;
          for (let k = 0; k < n * 2; k++) {
            const a = k * Math.PI / n + lt * 0.02, rr = k % 2 ? R * 0.42 : R * (0.85 + 0.3 * ((k * 37) % 5) / 5);
            ctx.lineTo(ox + Math.cos(a) * rr, oy + Math.sin(a) * rr);
          }
          ctx.closePath(); ctx.fill(); ctx.stroke();
          break;
        }
        case 'sweat': {    // 汗滴：冒出来、往下滑一点、淡掉
          const dur = fx.dur || 50, p = clamp(lt / dur, 0, 1);
          const s = (fx.size || 0.025) * W;
          ctx.globalAlpha = p < 0.15 ? p / 0.15 : p > 0.75 ? (1 - p) / 0.25 : 1;
          const y = oy + p * s * 1.5;
          ctx.fillStyle = '#BFE8FF'; ctx.strokeStyle = '#2A4A66'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(ox, y - s * 1.3);
          ctx.quadraticCurveTo(ox + s, y, ox, y + s * 0.6); ctx.quadraticCurveTo(ox - s, y, ox, y - s * 1.3);
          ctx.fill(); ctx.stroke();
          break;
        }
        case 'particles': {
          const P = fx.P;
          for (const p of fx.parts) {
            if (lt > p.life) continue;
            ctx.globalAlpha = (P.alpha || 1) * (1 - lt / p.life);
            ctx.fillStyle = ctx.strokeStyle = p.color;
            if (P.shape === 'line') { ctx.lineWidth = p.size * 0.6; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 2, p.y - p.vy * 2); ctx.stroke(); }
            else if (P.shape === 'rect') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6); ctx.restore(); }
            else if (P.shape === 'heart') drawHeart(p.x, p.y, p.size);
            else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size / 2, 0, 6.29); ctx.fill(); }
          }
          break;
        }
      }
      ctx.restore();
    }

    function drawHeart(x, y, s) {
      ctx.beginPath();
      ctx.moveTo(x, y + s * 0.35);
      ctx.bezierCurveTo(x - s * 0.6, y - s * 0.1, x - s * 0.3, y - s * 0.6, x, y - s * 0.25);
      ctx.bezierCurveTo(x + s * 0.3, y - s * 0.6, x + s * 0.6, y - s * 0.1, x, y + s * 0.35);
      ctx.fill();
    }

    // 屏幕特效（不跟镜头缩放）：渐晕、闪、频闪、文字
    function drawScreenFx(fx) {

const cellX = (c) => L.bx + c * L.cell;
const cellY = (r) => L.by + r * L.cell;

// ---------- 拖块 ----------
function slotCenter(i) {
  return { x: (W / 3) * (i + 0.5), y: L.trayY + L.trayH / 2 };
}
// 手指在 (x, y) 时，块落在哪一格（左上角）
function snap(p, x, y) {
  const left = x - (p.w * L.cell) / 2;
  const top = y - L.lift - (p.h * L.cell) / 2;
  return { r: Math.round((top - L.by) / L.cell), c: Math.round((left - L.bx) / L.cell) };
}
// 反过来：想放到 (r, c)，手指该在哪（测试和教学手势用）
function fingerFor(p, r, c) {
  return { x: L.bx + c * L.cell + (p.w * L.cell) / 2, y: L.by + r * L.cell + (p.h * L.cell) / 2 + L.lift };

// 如果放下去会消掉哪些格
function previewClear(p, r, c) {
  const b = g.board.slice();
  for (const [dr, dc] of p.cells) b[(r + dr) * 9 + c + dc] = 1;
  const set = new Set();
  for (let u = 0; u < 27; u++) if (core.UNITS[u].every((k) => b[k])) core.UNITS[u].forEach((k) => set.add(k));
  return set;

// ---------- 输入 ----------
function hitButton(x, y) {
  for (let i = buttons.length - 1; i >= 0; i--) {
    const b = buttons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y - 4 && y <= b.y + b.h + 6) return b;
  }
  return null;
}
function onTouch(type, id, x, y) {
  if (mode === 'cut') { if (type === 'down') { CUT.skip(); if (!CUT.playing) endCuts(); } return; }
  if (type === 'down') {
    if (drag) return; // 只认一根手指
    const b = hitButton(x, y);
    if (b) { downBtn = b.id; return; }
    if (mode === 'play' && !g.over && !(g.siege && (g.phase !== 'play' || siegeBusy())) && y > L.trayY - 20) {
      const i = Math.max(0, Math.min(2, Math.floor(x / (W / 3))));
      if (g.hand[i]) {
        drag = { slot: i, x, y, id };
        P.sound('pick', 0.5);
        P.vibrate(false);
      }
    }
  } else if (type === 'move') {
    if (drag && drag.id === id) { drag.x = x; drag.y = y; }
  } else if (type === 'up') {
    if (downBtn) {
      const b = hitButton(x, y);
      const was = downBtn;
      downBtn = null;
      if (b && b.id === was && b.fn) { P.sound('tap', 0.5); b.fn(); }
      return;
    }
    if (drag && drag.id === id) {
      drag.x = x; drag.y = y;
      drop();
    }
  }
}
function drop() {
  const i = drag.slot;
  const p = g.hand[i];
  const s = snap(p, drag.x, drag.y);
  drag = null;
  if (!p || !core.canPlace(g.board, p, s.r, s.c)) {
    P.sound('deny', 0.5);
    return;
  }
  const ci = handColor(i);
  if (g.pets) {
    const colorsBefore = colorAt.slice();
    const pev = g.place(i, s.r, s.c);
    if (!pev) return;
    for (let k = 0; k < 81; k++) if (g.board[k] === 1) colorAt[k] = g.color[k];
    if (!save.petTutDone) { save.petTutDone = true; save.tutorialDone = true; persist(); }
    juicePets(pev, colorsBefore);
    return;
  }
  if (g.siege) {
    const colorsBefore = colorAt.slice();
    p.cells.forEach(([dr, dc]) => (colorsBefore[(s.r + dr) * 9 + s.c + dc] = ci));
    const sev = g.place(i, s.r, s.c);
    if (!sev) return;
    p.cells.forEach(([dr, dc]) => (colorAt[(s.r + dr) * 9 + s.c + dc] = ci));
    juiceSiege(sev, colorsBefore);
    return;
  }
  const ev = g.place(i, s.r, s.c);
  if (!ev) return;
  p.cells.forEach(([dr, dc]) => (colorAt[(s.r + dr) * 9 + s.c + dc] = ci));
  if (!save.tutorialDone) { save.tutorialDone = true; persist(); }
  juice(ev);
  if (g.over) endGame();
}

// ---------- 爽感：照点子卡的节拍表 ----------
const BEATS = {
  1: { stop: 0, shake: 0 },
  2: { stop: 30, shake: 0 },
  3: { stop: 60, shake: 3 },
  4: { stop: 90, shake: 6 },
  5: { stop: 120, shake: 11 },
  6: { stop: 200, shake: 14 },

function say(s) { mofei.say = s; mofei.sayT = clock; mofei.jump = clock; }
function juice(ev) {

  stopUntil = now + beat.stop;
  shake = Math.max(shake, beat.shake);
  const p = ev.piece;
  p.cells.forEach(([dr, dc]) => popping.push({ k: (ev.r + dr) * 9 + ev.c + dc, t: clock }));
  // 跳字：加了多少

  const cy = cellY(ev.r) + (p.h * L.cell) / 2;

    P.vibrate(false);
    texts.push({ s: '+' + ev.gained, x: cx, y: cy, t: clock, size: 16, col: COL.text });
    return;
  }
  // 消除
  const cleared = new Set(ev.cells);
  cleared.forEach((k) => {
    clearing.push({ k, t: clock });
    const x = cellX(k % 9) + L.cell / 2, y = cellY(Math.floor(k / 9)) + L.cell / 2;
    for (let n = 0; n < (ev.beat >= 4 ? 4 : 3); n++) {
      const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * (80 + ev.beat * 40);
      fx.push({ kind: 'shard', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, t: clock, life: 0.5 + Math.random() * 0.3, s: 3 + Math.random() * 4 });
    }
    if (Math.random() < 0.5) fx.push({ kind: 'steam', x, y, vx: (Math.random() - 0.5) * 30, vy: -40 - Math.random() * 40, t: clock, life: 0.7 + Math.random() * 0.4, s: L.cell * 0.4 });
  });
  if (ev.beat >= 4) {
    // 齿轮崩飞
    for (let n = 0; n < 4 + ev.combo * 2; n++) {
      const a = Math.random() * Math.PI * 2, sp = 150 + Math.random() * 200;
      fx.push({ kind: 'gear', x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, t: clock, life: 0.9, s: 6 + Math.random() * 8, a: Math.random() * 6 });
    }
  }
  if (ev.beat >= 5) {
    // 连弩齐射：三道弩箭扫过棋盘
    for (let n = 0; n < 3; n++) bolts.push({ row: 1 + n * 3.5, t: clock + n * 0.06, dir: n % 2 ? -1 : 1 });
    rings.push({ t: clock, big: ev.center });
    flash = 0.35;
    P.vibrate(true);
  }
  if (ev.crossbow) bolts.push({ row: ev.crossbow.row + 0.5, t: clock, dir: 1 });
  ev.newlyLit.forEach((b) => litAnim.push({ b, t: clock }));
  // 旅程：收走的东西飞向顶上的计数
  (ev.collected || []).forEach((c, n) => {
    flyers.push({ what: c.what, x: cellX(c.k % 9) + L.cell / 2, y: cellY(Math.floor(c.k / 9)) + L.cell / 2, t: clock + n * 0.05 });
  });
  if (ev.collected && ev.collected.length) setTimeout(() => P.sound('coin', 0.5), 380);
  // 声音
  if (ev.beat === 2) P.sound('line', 0.7);
  if (ev.beat === 3) P.sound('box', 0.8);
  if (ev.beat === 4) P.sound(ev.combo >= 3 || ev.streak >= 5 ? 'combo4' : ev.combo >= 2 ? 'combo3' : 'combo2', 0.7), P.sound('line', 0.5);
  if (ev.beat === 5) P.sound('five', 0.9), P.sound('combo4', 0.4);
  if (ev.crossbow) P.sound('bolt', 0.6);
  if (ev.newlyLit.length) setTimeout(() => P.sound('lit', 0.6), 120);
  if (ev.beat >= 3) P.vibrate(ev.beat >= 4);
  // 跳字
  let label = '+' + ev.gained;
  texts.push({ s: label, x: cx, y: cy - 6, t: clock, size: 18 + ev.beat * 4, col: ev.beat >= 4 ? COL.brassLight : COL.text });
  if (ev.center) texts.push({ s: '×5', x: cellX(4) + L.cell / 2, y: cellY(4) + L.cell / 2, t: clock + 0.05, size: 64, col: COL.red, big: true });
  else if (ev.combo >= 2) texts.push({ s: '连击 ×' + ev.combo, x: W / 2, y: L.by + L.board * 0.32, t: clock, size: 30 + ev.combo * 4, col: COL.brassLight, big: true });
  else if (ev.streak >= 3) texts.push({ s: '连消 ' + ev.streak, x: W / 2, y: L.by + L.board * 0.32, t: clock, size: 30, col: COL.jade, big: true });
  if (ev.sparrow) texts.push({ s: '+5 秒', x: W / 2, y: L.top + 50, t: clock, size: 22, col: COL.jade });
  if (ev.turtle) texts.push({ s: '蒸汽龟！', x: W / 2, y: L.trayY - 8, t: clock, size: 22, col: COL.jade });
  if (ev.win && g.stage) { P.sound('win', 0.8); say('过关！'); flash = 0.4; }
  else if (ev.win) { P.sound('win', 0.8); say('成了！'); flash = 0.6; }
  else if (ev.center) say('正中间！');
  else if (ev.beat >= 4) say(ev.combo >= 2 ? '好！' : '连上了');
  else if (ev.newlyLit.length) say('亮了');
}

// ---------- 一局结束 ----------
function endGame() {
  // 一局只结算一次（宠物动画还在排队时这一关就赢了，排队里的「结算」会再叫一次）
  if (g._ended) return;
  g._ended = true;
  overAt = clock;
  stats.overs.push(P.now());
  drag = null;
  if (g.siege) return endSiege();
  if (g.pets) return endPet();
  if (g.stage) {
    // 旅程：过关 → 记进度、给金币；输 → 差一点就写还差几个
    if (g.won) save.stage = Math.max(save.stage, stageIdx + 1);
    coinsGot = Math.floor(g.score * C.coinPerScore) + (g.won ? C.coinStageWin : 0);
    save.coins += coinsGot;
    persist();
    result = { won: g.won, reason: g.reason, near: g.nearMiss(), left: g.goalLeft(), doubled: false };
    mode = 'over';
    if (!g.won) { P.sound('lose', 0.6); say('堵住了'); }
    return;
  }
  const lit = g.litCount();
  if (!g.endless) g.lit.forEach((v, b) => v && (save.litEver[paintIdx][b] = true));
  let unlocked = null;
  if (g.won) {
    save.won[paintIdx] = true;
    save.wins++;
    const it = ITEMS[save.wins - 1];
    if (it && !save.items[it.id]) { save.items[it.id] = true; unlocked = it; }
  }
  coinsGot = Math.floor(g.score * C.coinPerScore) + (g.endless ? 0 : lit * C.coinPerBox) + (g.won ? C.coinWin : 0);
  save.coins += coinsGot;
  if (g.endless) save.bestEndless = Math.max(save.bestEndless, g.score);
  else save.best = Math.max(save.best, g.score);
  persist();
  result = { won: g.won, reason: g.reason, lit, near: g.nearMiss(), unlocked, doubled: false };
  mode = 'over';
  if (!g.won) { P.sound('lose', 0.6); say(g.reason === 'time' ? '时辰到' : '堵住了'); }
}
function continueAfterAd(fn) {
  ad = { until: clock + C.adSec, done: fn };
  mode = 'ad';
}

// ---------- 更新 ----------
function update(dt) {
  clock += dt;
  runTimeline();
  if (mode === 'play' && g && !g.over && P.now() >= stopUntil) {
    if (g.tick(dt)) endGame();
    // 最后 10 秒：嘀
    if (!g.endless && g.timeLeft <= 10 && !g.over) {
      const s = Math.ceil(g.timeLeft);
      if (s !== lastTick) { lastTick = s; P.sound('tick', 0.5); if (s === 10) say('快！'); }
    }
  }
  if (mode === 'ad' && clock >= ad.until) { const f = ad.done; ad = null; f(); }
  if (P.now() < stopUntil) return; // 顿帧：特效也停一下
  const fdt = dt;
  fx.forEach((f) => { f.x += f.vx * fdt; f.y += f.vy * fdt; f.vy += (f.kind === 'steam' ? -10 : 600) * fdt; if (f.kind === 'gear') f.a += fdt * 8; });
  fx = fx.filter((f) => clock - f.t < f.life);
  texts = texts.filter((t) => clock - t.t < (t.big ? 1.1 : 0.8));
  clearing = clearing.filter((c) => clock - c.t < 0.3);
  popping = popping.filter((c) => clock - c.t < 0.15);
  litAnim = litAnim.filter((c) => clock - c.t < 1.2);
  bolts = bolts.filter((b) => clock - b.t < 0.5);
  rings = rings.filter((r) => clock - r.t < 0.9);
  flyers = flyers.filter((f) => {
    if (clock - f.t < 0.55) return true;
    if (f.what === 'spark') petFx.pop[f.pet] = clock; else chipPop[f.what] = clock;
    return false;
  });
  shake *= Math.pow(0.002, dt);
  if (shake < 0.3) shake = 0;
  flash = Math.max(0, flash - dt * 1.6);
  if (g) displayScore += (g.score - displayScore) * Math.min(1, dt * 10);
}

// ---------- 画 ----------
function drawBg() {
  // 靛蓝夜：上亮下暗
  const bgG = ctx.createLinearGradient(0, 0, 0, H);
  bgG.addColorStop(0, COL.bg); bgG.addColorStop(1, COL.bgLow);
  ctx.fillStyle = bgG;
  ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = 0.05;
  gearIcon(W * 0.1, H * 0.92, 60, clock * 0.1, COL.brass);
  gearIcon(W * 0.95, H * 0.12, 46, -clock * 0.13, COL.brass);
  ctx.globalAlpha = 1;
}
// 旅程的顶栏：返回、第几关、目标计数（还差几个；够了打勾）
function drawStageHud() {

  text(g.pets ? petLevelName() : '第 ' + (stageIdx + 1) + ' 关', W / 2, y + 10, 15, COL.dim, 'center', 'normal');
  const left = g.goalLeft();

    const frac = Math.min(1, displayScore / goal);

    ctx.fillStyle = COL.woodDark; rr(cx - 30, cy - 17, 60, 34, 9); ctx.fill();
    const sz = 22 * (1 + pop);
    goalIcon(key, cx - 13, cy, sz);
    chipPos[key] = { x: cx - 13, y: cy };
    if (left[key] === 0) text('✓', cx + 15, cy + 1, 22, COL.jade);
    else text(String(left[key]), cx + 15, cy + 1, 20, COL.text);
  });
}

}
function drawBoard(showGhost) {
  const { bx, by, cell, board: B } = L;
  // 木框
  ctx.fillStyle = COL.ink; rr(bx - 9, by - 9 + 4, B + 18, B + 18, 10); ctx.fill();
  ctx.fillStyle = COL.copper; rr(bx - 9, by - 9, B + 18, B + 18, 10); ctx.fill();
  // 黄铜框：一道硬高光 + 四角铆钉
  ctx.fillStyle = COL.brassLight; ctx.fillRect(bx - 2, by - 7, B + 4, 2);
  ctx.fillStyle = COL.brassDark;
  for (const [cx, cy] of [[bx - 5, by - 5], [bx + B + 5, by - 5], [bx - 5, by + B + 5], [bx + B + 5, by + B + 5]]) { ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = COL.ink; ctx.fillRect(bx - 2, by - 2, B + 4, B + 4);
  // 连消中：棋盘边框烧起来，连得越久越亮、越跳
  if (g.streak >= 2) {
    const heat = Math.min(1, (g.streak - 1) / 5);
    for (let n = 0; n < 3; n++) {
      ctx.strokeStyle = n === 0 ? 'rgba(255,240,180,' + (0.5 + heat * 0.4) + ')' : n === 1 ? 'rgba(255,150,60,' + (0.35 + heat * 0.4) + ')' : 'rgba(226,85,59,' + (0.25 + heat * 0.3) + ')';
      ctx.lineWidth = 3 + n * 4 + Math.sin(clock * 14 + n) * (1 + heat * 2);
      rr(bx - 11 - n * 3, by - 11 - n * 3, B + 22 + n * 6, B + 22 + n * 6, 12);
      ctx.stroke();
    }
    // 边上往上飘的火星
    if (Math.random() < 0.3 + heat * 0.5) {
      const side = Math.random() * (B + 20);
      fx.push({ kind: 'shard', x: bx - 10 + side, y: by + B + 8, vx: (Math.random() - 0.5) * 40, vy: -120 - Math.random() * 120, t: clock, life: 0.6, s: 2 + Math.random() * 3 });
    }
  }
  const pc = paintCanvas[paintIdx];
  const PX = paintSize[paintIdx] / 9;
  ctx.imageSmoothingEnabled = paintSmooth[paintIdx];
  for (let k = 0; k < 81; k++) {
    const r = Math.floor(k / 9), c = k % 9, x = cellX(c), y = cellY(r);
    const box = core.boxOf(r, c);
    if (g.revealed[k]) {
      ctx.drawImage(pc, c * PX, r * PX, PX, PX, x, y, cell, cell);
      if (!g.lit[box]) { ctx.fillStyle = COL.shade + '0.45)'; ctx.fillRect(x, y, cell, cell); }
    } else if (g.stage) {
      // 旅程：照 Woodoku，九宫一深一浅隔开，一眼看出宫
      ctx.fillStyle = box % 2 ? (r + c) % 2 ? COL.cellC : COL.cellD : (r + c) % 2 ? COL.cellA : COL.cellB;
      ctx.fillRect(x, y, cell, cell);
    } else {
      ctx.fillStyle = (r + c) % 2 ? COL.cellB : COL.cellC;
      ctx.fillRect(x, y, cell, cell);
      // 底下的画隐约透出来一点（消掉才真亮）
      ctx.globalAlpha = 0.13;
      ctx.drawImage(pc, c * PX, r * PX, PX, PX, x, y, cell, cell);
      ctx.globalAlpha = 1;
      if (box === 4) drawLuoshu(r - 3, c - 3, x, y, cell);
    }
  }
  // 格线
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 1; i < 9; i++) {
    if (i % 3 === 0) continue;
    ctx.moveTo(bx + i * cell + 0.5, by); ctx.lineTo(bx + i * cell + 0.5, by + B);
    ctx.moveTo(bx, by + i * cell + 0.5); ctx.lineTo(bx + B, by + i * cell + 0.5);
  }
  ctx.stroke();
  // 宫线（黄铜细线）
  ctx.strokeStyle = COL.copper; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 1; i < 3; i++) {
    ctx.moveTo(bx + i * 3 * cell, by); ctx.lineTo(bx + i * 3 * cell, by + B);
    ctx.moveTo(bx, by + i * 3 * cell); ctx.lineTo(bx + B, by + i * 3 * cell);
  }
  ctx.stroke();
  // 中宫的红框（城心）；旅程里没有
  if (!g.stage) {
    ctx.strokeStyle = 'rgba(226,85,59,0.55)'; ctx.lineWidth = 2;
    ctx.strokeRect(cellX(3) + 2, cellY(3) + 2, cell * 3 - 4, cell * 3 - 4);
  }

  // 拖的时候：落点和会消掉的格子
  let ghost = null, willClear = null;
  if (showGhost && drag && g.hand[drag.slot]) {
    const p = g.hand[drag.slot];
    const s = snap(p, drag.x, drag.y);
    if (core.canPlace(g.board, p, s.r, s.c)) {
      ghost = { p, s, ci: handColor(drag.slot), hg: g.handGem[drag.slot] };
      willClear = previewClear(p, s.r, s.c);
    }
  }
  if (willClear && willClear.size) {
    ctx.fillStyle = 'rgba(243,210,122,' + (0.22 + Math.sin(clock * 10) * 0.08) + ')';
    willClear.forEach((k) => ctx.fillRect(cellX(k % 9), cellY(Math.floor(k / 9)), cell, cell));
  }
  // 块
  for (let k = 0; k < 81; k++) {
    if (!g.board[k]) continue;
    const pop = popping.find((p) => p.k === k);
    const sc = pop ? 1 + 0.18 * (1 - (clock - pop.t) / 0.15) : 1;
    const s = cell * sc, x = cellX(k % 9) + (cell - s) / 2, y = cellY(Math.floor(k / 9)) + (cell - s) / 2;
    if (g.board[k] === 3) { inkMonster(x + s / 2, y + s / 2, s * 0.4, false); continue; }
    if (g.board[k] === 6) { armorMonster(x + s / 2, y + s / 2, s * 0.4, petFx.armorBounce && petFx.armorBounce[k] ? Math.max(0, 0.3 - (clock - petFx.armorBounce[k])) : 0); continue; }
    if (g.board[k] === 7) { jumperMonster(x + s / 2, y + s / 2, s * 0.4, g.jumpPlan && g.jumpPlan[k] !== undefined ? g.jumpPlan[k] : null, k); continue; }
    if (g.board[k] === 5) { ironRock(x, y, s); if (g.rockHp && g.rockHp[k] > 1) { ctx.strokeStyle = '#8a90a0'; ctx.lineWidth = 2; ctx.strokeRect(x + 4, y + 4, s - 8, s - 8); ctx.strokeRect(x + 8, y + 8, s - 16, s - 16); } continue; }
    if (g.board[k] === 4) {
      // 大墨怪：2×2 画成一只，只在左上那格画
      if (g.bigCells && g.bigCells[0] === k) {
        const hit = petFx.bossHit && clock - petFx.bossHit < 0.3 ? Math.sin(clock * 70) * 5 : 0;
        const scared = petFx.bossScared ? Math.sin(clock * 40) * 2 : 0;
        inkMonster(x + s + hit + scared, y + s, s * 0.85 * (petFx.bossScared ? 0.94 : 1), true);
        // 头上几颗红心 = 还要打几下；打中一下碎一颗（宠物咬、或者它晕着时打中，碎两颗）
        const tot = g.stage.bigHp || 3, hs = tot > 5 ? 7 : 10, gap = tot > 5 ? 17 : 26;
        for (let n = 0; n < tot; n++) heart(x + s - (tot - 1) * gap / 2 + n * gap, y - 22, hs, n < g.bigHp);
        // 刚吐完墨：头上转星星（这时候打它掉 2 颗心）
        if (g.boss && g.boss.stun) for (let n = 0; n < 3; n++) { const a = clock * 4 + (n * Math.PI * 2) / 3; starShape(x + s + Math.cos(a) * s * 0.7, y + s * 0.25 + Math.sin(a) * 6, 6, COL.brassLight); }
      }
      continue;
    }
    if (g.board[k] === 2) {
      // 机关匣：要被消的那一下亮一圈
      chest(x, y, s);
      if (willClear && willClear.has(k)) { ctx.strokeStyle = COL.brassLight; ctx.lineWidth = 3; ctx.strokeRect(x + 2, y + 2, s - 4, s - 4); }
      continue;
    }
    block(x, y, s, 1, colorAt[k], willClear && willClear.has(k));
    if (g.gem[k]) gem(x, y, s, g.gem[k]);
  }
  if (ghost) {
    ghost.p.cells.forEach(([dr, dc], n) => {
      block(cellX(ghost.s.c + dc), cellY(ghost.s.r + dr), cell, 0.4, ghost.ci);
      if (ghost.hg && ghost.hg.cell === n) gem(cellX(ghost.s.c + dc), cellY(ghost.s.r + dr), cell, ghost.hg.kind, 0.6);
    });
  }
  if (g.siege) drawSiegeBoard();
  if (g.pets) drawPetBoard();
  // 泡泡压在最上面（下面有块时也看得见）
  for (let k = 0; k < 81; k++) if (g.bubble[k]) bubbleAt(cellX(k % 9), cellY(Math.floor(k / 9)), cell, willClear && willClear.has(k) ? 0.5 + Math.sin(clock * 12) * 0.3 : 1);
  // 正在碎掉的块：变白、缩小
  clearing.forEach((cl) => {
    const a = (clock - cl.t) / 0.3;
    const s = cell * (1 - a * 0.8);
    const x = cellX(cl.k % 9) + (cell - s) / 2, y = cellY(Math.floor(cl.k / 9)) + (cell - s) / 2;
    ctx.globalAlpha = 1 - a;
    ctx.fillStyle = a < 0.4 ? '#fff' : COL.brassLight;
    ctx.fillRect(x, y, s, s);
    ctx.globalAlpha = 1;
  });
  // 城区点亮：白闪 + 齿轮转一圈
  litAnim.forEach((la) => {
    const a = (clock - la.t) / 1.2;
    const x = cellX((la.b % 3) * 3), y = cellY(Math.floor(la.b / 3) * 3), s = cell * 3;
    ctx.fillStyle = 'rgba(255,240,200,' + Math.max(0, 0.7 - a * 1.4) + ')';

    ctx.lineWidth = 4;

    ctx.globalAlpha = 1 - a;
    gearIcon(x + s / 2, y + s / 2, cell * 0.6 * (1 + a * 0.4), a * Math.PI * 2, COL.brassLight);
    ctx.globalAlpha = 1;
  });
  // 洛书光阵：从城心一圈圈亮开
  rings.forEach((rg) => {
    const a = (clock - rg.t) / 0.9;
    const cx = rg.at ? rg.at.x : cellX(4) + cell / 2, cy = rg.at ? rg.at.y : cellY(4) + cell / 2;
    for (let n = 0; n < 3; n++) {
      const rad = (a * 1.2 - n * 0.15) * B * (rg.at ? 0.45 : 0.8); // 火雷炸开的圈小一点
      if (rad <= 0) continue;
      ctx.strokeStyle = 'rgba(243,210,122,' + Math.max(0, 0.9 - a) + ')';

    }
  });

  bolts.forEach((b) => {
    const a = (clock - b.t) / 0.5;
    if (a < 0) return;
    const y = by + b.row * cell;
    const head = b.dir > 0 ? bx - 40 + a * (B + 80) : bx + B + 40 - a * (B + 80);
    ctx.fillStyle = 'rgba(255,240,200,' + (1 - a) + ')';
    ctx.fillRect(Math.min(head, head - b.dir * 70), y - 2, 70, 4);
    ctx.fillStyle = COL.brassLight;
    ctx.beginPath(); ctx.moveTo(head + b.dir * 12, y); ctx.lineTo(head, y - 6); ctx.lineTo(head, y + 6); ctx.fill();
  });
}
// 洛书：4 9 2 / 3 5 7 / 8 1 6，奇数白点、偶数黑点
const LUOSHU = [4, 9, 2, 3, 5, 7, 8, 1, 6];
function drawLuoshu(r, c, x, y, s) {
  const n = LUOSHU[r * 3 + c];
  // 洛书点：奇数白点淡淡发光、偶数深点
  ctx.fillStyle = n % 2 ? 'rgba(235,229,212,0.4)' : COL.shade + '0.6)';
  const cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n / cols);
  const d = s / (Math.max(cols, rows) + 1.2);
  for (let i = 0; i < n; i++) {
    const cx = x + s / 2 + ((i % cols) - (cols - 1) / 2) * d;
    const cy = y + s / 2 + (Math.floor(i / cols) - (rows - 1) / 2) * d;
    ctx.beginPath(); ctx.arc(cx, cy, Math.max(1.5, d * 0.28), 0, Math.PI * 2); ctx.fill();
  }
}
function drawPiece(p, cx, cy, s, alpha, ci, hg) {
  const x0 = cx - (p.w * s) / 2, y0 = cy - (p.h * s) / 2;
  if (p.special === 'fire') {
    // 火麒麟送的火块：发光的红块 + 一团火苗，一眼和普通块分开
    const glow = 0.5 + Math.sin(clock * 8) * 0.3;
    ctx.fillStyle = 'rgba(255,140,60,' + glow * 0.5 + ')'; ctx.beginPath(); ctx.arc(cx, cy, s * 0.9, 0, Math.PI * 2); ctx.fill();
    block(x0, y0, s, alpha, 1, true);
    ctx.fillStyle = '#ffd36a'; ctx.beginPath(); ctx.moveTo(cx, cy - s * 0.38); ctx.quadraticCurveTo(cx + s * 0.3, cy, cx, cy + s * 0.3); ctx.quadraticCurveTo(cx - s * 0.3, cy, cx, cy - s * 0.38); ctx.fill();
    ctx.fillStyle = '#ff6a2a'; ctx.beginPath(); ctx.arc(cx, cy + s * 0.08, s * 0.12, 0, Math.PI * 2); ctx.fill();
    return;
  }
  p.cells.forEach(([r, c], n) => {
    block(x0 + c * s, y0 + r * s, s, alpha, ci);

}

function drawFx() {
  if (g && g.siege) drawMissiles();
  if (g && g.pets) drawPetRuns();
  flyers.forEach((f) => {
    const a = (clock - f.t) / 0.55;
    if (f.what === 'spark') {
      // 宠物：同色的方块化成光点飞到宠物身上
      if (a < 0) return;
      const e = a * a;
      const x = f.x + (f.to.x - f.x) * e, y = f.y + (f.to.y - f.y) * e - Math.sin(a * Math.PI) * 30;
      ctx.fillStyle = f.col; ctx.globalAlpha = 1 - a * 0.3;
      ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      return;
    }
    if (f.what === 'dmg') {
      // 守城：总伤害飞上去砸在车上
      if (a < 0) return;
      const e = 1 - (1 - a) * (1 - a);
      const x = f.x + (f.to.x - f.x) * e, y = f.y + (f.to.y - f.y) * e;
      text(f.s, x, y, Math.round(34 - a * 10), COL.red);

    const to = chipPos[f.what] || { x: W / 2, y: L.top + 40 };
    const e = 1 - (1 - a) * (1 - a);
    const x = f.x + (to.x - f.x) * e, y = f.y + (to.y - f.y) * e - Math.sin(a * Math.PI) * 60;
    goalIcon(f.what, x, y, L.cell * (0.8 + Math.sin(a * Math.PI) * 0.4));
  });

    const a = 1 - (clock - f.t) / f.life;
    ctx.globalAlpha = Math.max(0, a);
    if (f.kind === 'shard') { ctx.fillStyle = a > 0.6 ? COL.brassLight : COL.brass; ctx.fillRect(f.x, f.y, f.s, f.s); }
    else if (f.kind === 'steam') { ctx.fillStyle = COL.steam; ctx.beginPath(); ctx.arc(f.x, f.y, f.s * (1.6 - a), 0, Math.PI * 2); ctx.fill(); }

  });
  texts.forEach((t) => {
    const age = clock - t.t;
    if (age < 0) return;
    const life = t.big ? 1.1 : 0.8;
    const pop = t.big ? (age < 0.12 ? 0.6 + age * 5 : 1.2 - Math.min(0.2, (age - 0.12))) : 1;

    text(t.s, Math.max(half, Math.min(W - half, t.x)), t.y - age * (t.big ? 20 : 50), sz, t.col);

  });
}

// 结算页：把画亮出来，没亮的宫闪着
function drawPainting(idx, x, y, s, litArr, blink) {
  ctx.imageSmoothingEnabled = paintSmooth[idx];
  ctx.fillStyle = COL.ink; ctx.fillRect(x - 4, y - 4, s + 8, s + 8);
  ctx.drawImage(paintCanvas[idx], 0, 0, paintSize[idx], paintSize[idx], x, y, s, s);
  const q = s / 3;
  for (let b = 0; b < 9; b++) {
    if (litArr[b]) continue;
    const bx = x + (b % 3) * q, by = y + Math.floor(b / 3) * q;
    ctx.fillStyle = COL.shade + '0.86)'; ctx.fillRect(bx, by, q, q);
    if (blink) {
      ctx.strokeStyle = 'rgba(226,85,59,' + (0.5 + Math.sin(clock * 8) * 0.4) + ')';
      ctx.lineWidth = 3; ctx.strokeRect(bx + 3, by + 3, q - 6, q - 6);
    }
  }
  ctx.strokeStyle = COL.brass; ctx.lineWidth = 2;
  for (let i = 1; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(x + i * q, y); ctx.lineTo(x + i * q, y + s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y + i * q); ctx.lineTo(x + s, y + i * q); ctx.stroke();
  }
}

const MAP_SHOW = 5; // 一屏看几关
function mapNodePos(i, lo) {

  const step = (bottom - top) / (MAP_SHOW - 1);
  return { x: W / 2 + (i % 2 ? 1 : -1) * Math.min(62, W * 0.16), y: bottom - (i - lo) * step, step };
}
// 两关之间的小图：第 i 关过了才亮。每 5 关一张画，5 张小图 = 那张画的 5 宫
function mapPicture(i, x, y, s) {
  const ch = Math.floor(i / 5) % art.COUNT, b = (i % 5) * 2;

// 弩箭：从消掉的那一排飞到车上（画在最上层）
function drawMissiles() {
  missiles = missiles.filter((m) => clock - m.t < 0.4);
  const cp = cartPos();
  missiles.forEach((m) => {
    const a = (clock - m.t) / 0.4, e = a * a;
    const x = m.x0 + (cp.x - m.x0) * e, y = m.y0 + (cp.y + 10 - m.y0) * e;
    const ang = Math.atan2(cp.y - m.y0, cp.x - m.x0);
    const len = 46 + Math.min(40, m.dmg / 4);
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.fillStyle = 'rgba(255,240,200,0.5)'; ctx.fillRect(-len - 30, -3, 30, 6);
    ctx.fillStyle = COL.brassLight; ctx.fillRect(-len, -2.5, len, 5);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, -8); ctx.lineTo(-6, 8); ctx.fill();
    ctx.restore();

// 攻城车（正面朝下，冲着城门来）：木架子 + 顶棚 + 往下伸的撞木 + 四个轮子；头目是红顶
function drawCart(x, y, boss, white) {
  const wood = white ? '#fff' : '#8a6438', dark = white ? '#fff' : '#5e4226';
  // 轮子
  for (const [dx, dy] of [[-34, -16], [34, -16], [-34, 14], [34, 14]]) {
    ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.arc(x + dx, y + dy, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COL.copper; ctx.beginPath(); ctx.arc(x + dx, y + dy, 5.5, 0, Math.PI * 2); ctx.fill();
  }
  // 车身
  ctx.fillStyle = COL.ink; rr(x - 30, y - 26, 60, 52, 6); ctx.fill();
  ctx.fillStyle = wood; rr(x - 28, y - 24, 56, 48, 5); ctx.fill();
  ctx.fillStyle = dark; for (let k = -1; k <= 1; k++) ctx.fillRect(x - 28, y + k * 14 - 1, 56, 3);
  // 顶棚
  ctx.fillStyle = white ? '#fff' : boss ? '#b8322a' : '#6b4a2a';
  ctx.beginPath(); ctx.moveTo(x - 34, y - 20); ctx.lineTo(x, y - 40); ctx.lineTo(x + 34, y - 20); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = COL.ink; ctx.lineWidth = 2; ctx.stroke();
  // 撞木：往下伸，铜头
  ctx.fillStyle = COL.ink; ctx.fillRect(x - 7, y + 20, 14, 26);
  ctx.fillStyle = dark; ctx.fillRect(x - 5, y + 20, 10, 24);
  ctx.fillStyle = COL.brassLight; rr(x - 9, y + 42, 18, 10, 3); ctx.fill();
  if (boss) { ctx.fillStyle = COL.brassLight; ctx.beginPath(); ctx.arc(x, y - 30, 4, 0, Math.PI * 2); ctx.fill(); }
}

function endSiege() {
  if (g.won && g.firstRun && !save.siegeDone) save.siegeDone = true;
  if (!g.daily && !g.endlessOn && (!g.firstRun || g.won)) save.siegeRuns = (save.siegeRuns || 0) + 1;
  const prevBest = save.siegeBest || 0;
  let dailyPrev = 0;
  if (g.daily) {
    const d = dailyRec();
    dailyPrev = d.best;
    d.best = Math.max(d.best, g.wavesWon);
    d.bestHit = Math.max(d.bestHit, g.bestHit);
  } else save.siegeBest = Math.max(prevBest, g.wavesWon);
  coinsGot = Math.floor(g.totalDmg / 40) + g.wavesWon * 3;
  save.coins += coinsGot;
  persist();
  result = { won: g.won, reason: g.reason, near: g.nearMiss(), doubled: false, prevBest, dailyPrev, record: g.daily ? g.wavesWon > dailyPrev : g.endlessOn && g.wavesWon > prevBest };
  mode = 'over';
  if (!g.won) { P.sound('lose', 0.6); say(g.reason === 'gate' ? '城破了' : '堵住了'); }
}
// 失败时那一句「差几波」（Cc 定的方向：失败时显示「差一波就守住了」）
function wavesLine() {
  const r = result, n = g.wavesWon;
  if (g.daily) {
    if (r.record) return n > 0 ? '今天新纪录：守住 ' + n + ' 波！' : '';

    return gap === 0 ? '追平今天最好的 ' + r.dailyPrev + ' 波，再守一波就破纪录' : '差 ' + gap + ' 波追平今天最好的 ' + r.dailyPrev + ' 波';
  }
  if (!g.endlessOn) { const gap = SG.FIRST_RUN_WAVES - n; return gap === 1 ? '差一波就守住了！' : '守住 ' + n + ' 波，差 ' + gap + ' 波就守住了'; }
  if (r.record) return '新纪录：守住 ' + n + ' 波！';
  const gap = r.prevBest - n;
  return gap <= 0 ? '' : '差 ' + gap + ' 波追上你最好的 ' + r.prevBest + ' 波';
}

// ---------- 主循环 ----------
function frame() {
  const now = P.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update((mode === 'album' && albumFrom === 'play') || mode === 'cut' ? 0 : dt);
  buttons = [];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (mode !== 'cut' && CUT.playing) CUT.clear(); // 过场中被别的入口切走了（只有测试会这样）
  if (mode === 'cut') {
    CUT.update(dt * 1000);
    if (CUT.playing) CUT.draw(); else { endCuts(); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
  } else if (mode === 'album') {
    drawAlbum();
  } else if (mode === 'home') {
    drawHome();
  } else if (mode === 'settings') {
    drawSettings();
  } else if (mode === 'camp') {
    drawCamp();
  } else if (mode === 'map') {
    ctx.save();
    drawMap();
    ctx.restore();

          const hit = lineCells(lastLine.type, i).filter((k) => b[k] === 1);
          hit.forEach((k) => { b[k] = 0; touched.add(k); });
          events.push({ type: lastLine.type, idx: i, by: id });
          const dmg = lineDmg(lastLine.type) + hit.length * (CELL_DMG + (L >= 3 ? 2 : 0));
          base += dmg; step.dmg += dmg;
          step.lines.push({ axis: lastLine.type, idx: i });
          step.cells = step.cells.concat(hit);
        }
        if (shoot.length) { steps.push(step); chainCheck(before, step); }
      } else if (id === 'loader' && lastLine) {
        used.add(id); changed = true;
        loader = L;
        steps.push({ kind: 'relic', id, cells: [], dmg: 0 });
      } else if (id === 'inkline' && events.length) {
        used.add(id); changed = true;
        const maxE = L >= 2 ? 4 : 3;
        const times = L >= 3 ? 2 : 1;
        const step = { kind: 'relic', id, lines: [], cells: [], dmg: 0 };
        for (let t = 0; t < times; t++) {
          let best = null;
          for (const axis of ['row', 'col']) for (let i = 0; i < 9; i++) {
            const cells = lineCells(axis, i);
            const e = cells.filter((k) => !b[k]).length;
            if (e >= 1 && e <= maxE && (!best || e < best.e)) best = { axis, i, e };
          }
          if (!best) break;
          const cells = lineCells(best.axis, best.i);
          const filled = cells.filter((k) => !b[k]);
          cells.forEach((k) => { if (b[k] !== 2) b[k] = 0; touched.add(k); });
          events.push({ type: best.axis, idx: best.i, by: id });
          const ld = lineDmg(best.axis);
          base += ld; step.dmg += ld;
          step.lines.push({ axis: best.axis, idx: best.i, filled });
          step.cells = step.cells.concat(cells);
        }
        if (step.lines.length) steps.push(step);
      } else if (id === 'thunder' && lastBox) {
        used.add(id); changed = true;
        const step = { kind: 'relic', id, box: lastBox.idx, cells: [], dmg: 0 };
        steps.push(step);
        blasted.add(lastBox.idx);
        blast(lastBox.idx, step, L >= 2 ? 2 : 1, 0);
      }
    }
  }

  // 3. 倍率
  const centerHit = events.some((e) => e.type === 'box' && e.idx === 4);
  const starHit = lv(st, 'star') > 0 && st.starBox !== undefined && boxCells(st.starBox).some((k) => touched.has(k));
  let mult = 1 + (st.hetuBonus || 0);
  const mults = [];
  if (st.charge > 1) { mult *= st.charge; mults.push({ id: 'loader', m: st.charge }); } // 上弦的倍率：下一次有消除的那一手用掉
  if (centerHit && (lv(st, 'center5') || st.tutorialX5)) {
    const m = [5, 5, 6, 8][lv(st, 'center5')] || 5;
    mult *= m; mults.push({ id: 'center5', m });
  }
  if (starHit) { const m = [0, 3, 4, 5][lv(st, 'star')]; mult *= m; mults.push({ id: 'star', m }); }
  if (st.hetuBonus) mults.push({ id: 'hetu', m: 1 + st.hetuBonus });
  let dmg = Math.round(base * mult);
  if (st.boss === 'armor' && dmg < 25) dmg = 0;
  return { board: b, dmg, base, mult, mults, steps, events, loader, centerHit, starHit, placed };
}

// ---------- 一局 ----------
// opts: { seed, tutorial, daily（每日一城：当天日期 20261121 这样的数）, relics:[{id,lv}]（测试用：开局直接带）, noRelics（测试用：不拿机关） }
// 每日一城：所有人当天同一串候选块、每一波同一组三选一；不封顶，一直守到城破，比谁守的波数多
function createSiege(opts) {
  const o = opts || {};
  const stage = { goal: {}, board: ['.........', '....#....'.replace('#', '.'), '.........', '.........', '.........', '.........', '.........', '.........', '.........'], d: 0.12 };
  const g = core.createGame({ stage, seed: o.seed, tutorial: o.tutorial });
  // 开局盘面：照旅程第 1 关摆 12 块旧铁块（中宫空着，教学第一块 3×3 放进去）
  const START = ['....#....', '.#.....#.', '.........', '#.......#', '#.......#', '#.......#', '.........', '.#.....#.', '....#....'];
  START.forEach((row, r) => row.split('').forEach((ch, c) => { if (ch === '#') g.board[r * 9 + c] = 1; }));
  Object.assign(g, {
    siege: true,
    wave: 0, waveDef: WAVES[0], hp: WAVES[0].hp, hpMax: WAVES[0].hp, round: 1,
    hpScale: o.tutorial ? 0.6 : (o.runNo || 0) <= 2 && !o.daily ? 0.8 : 1, // 第一局车血六折（必须守得住），第 2、3 局八折（机关还少）
    runNo: o.daily ? 99 : o.runNo || 0, // 这是第几局守城（0 起）：决定开放几件机关、三选一还是二选一
    relics: (o.relics || []).map((x) => ({ ...x })),
    starBox: STAR_PATH[0], starStep: 0, hetuBonus: 0,
    pendingLoader: 0, tutorialX5: false, // 不再白送 ×5（第一下太多数字，看不懂）
    phase: 'play', // play / choose / won（守住 3 波）
    offer: null, wavesWon: 0, totalDmg: 0, waveDmg: 0, bestHit: 0, maxChain: 0,
    triggers: {}, firstRun: !!o.tutorial,
  });
  if (o.tutorial) { g.hp = 25; g.hpMax = 25; } // 第一辆车：第一手 3×3 一放就打掉
  if (o.daily) {
    g.daily = o.daily;
    g.endlessOn = true; // 不在第 3 波停，一直守
    g.pieceRand = core.rng((o.daily * 2654435761) >>> 0); // 出块单独一条随机数：不受拿了什么机关影响
    g.hand = core.dealHand(g.board, g.pieceRand, g.diff(), true);
  }
  g.prefilled = new Set(START.flatMap((row, r) => row.split('').map((ch, c) => (ch === '#' ? r * 9 + c : -1))).filter((k) => k >= 0));
  g.diff = () => Math.min(0.6, 0.12 + g.wave * 0.08);
  const baseDeal = g.deal;
  // 发一轮：车走一步（第一轮不算）、星飞一宫、弩机上弦的长条
  g.newRound = () => {
    if (g.pieceRand) { g.deals++; g.hand = core.dealHand(g.board, g.pieceRand, g.diff(), true); }
    else baseDeal();
    if (g.pendingLoader) {
      const L = g.pendingLoader;
      const ids = L >= 2 ? ['5h', '5v'] : ['4h', '4v'];
      const slots = L >= 3 ? [0, 1] : [0];
      const hand = g.hand.slice();
      slots.forEach((s) => (hand[s] = PIECES[ids[Math.floor(g.rand() * 2)]]));
      if (core.solvable(g.board, hand)) g.hand = hand;
      else {
        // 换个方向再试一次
        slots.forEach((s) => (hand[s] = PIECES[hand[s].id === ids[0] ? ids[1] : ids[0]]));
        if (core.solvable(g.board, hand)) g.hand = hand;
      }
      g.pendingLoader = 0;
      g.loaderDealt = true;
    } else g.loaderDealt = false;
    g.handGem = [null, null, null];
  };
  g.moveStar = () => {
    g.starStep = (g.starStep + 1) % 9;
    g.starBox = STAR_PATH[g.starStep];
  };
  g.charge = 1; // 弩机上弦：下一手的倍率
  g.state = () => ({ relics: g.relics, starBox: g.starBox, hetuBonus: g.hetuBonus, boss: g.waveDef.boss, tutorialX5: g.tutorialX5, charge: g.charge });

  g.place = (i, r, c) => {
    const p = g.hand[i];
    if (!p || g.over || g.phase !== 'play' || !core.canPlace(g.board, p, r, c)) return null;
    const res = resolve(g.board, g.state(), p, r, c);
    g.board = res.board;
    g.hand[i] = null;
    g.moves++;
    if (res.events.length) g.tutorialX5 = false; // 教学白送的 ×5 只给第一次
    if (res.centerHit && lv(g, 'hetu')) g.hetuBonus += [0, 0.3, 0.45, 0.6][lv(g, 'hetu')];
    // 弩机上弦：有消除的这一手用掉攒着的倍率；这一手又消了行列，就重新上弦
    if (res.events.length) g.charge = res.loader ? [1, 2, 2.5, 3][res.loader] : 1;
    if (res.loader) g.pendingLoader = Math.max(g.pendingLoader, res.loader);
    res.steps.forEach((s) => { if (s.kind === 'relic') g.triggers[s.id] = (g.triggers[s.id] || 0) + 1; });
    const relicSteps = res.steps.filter((s) => s.kind === 'relic').length + (res.mults || []).length;
    g.maxChain = Math.max(g.maxChain, relicSteps);
    g.streak = res.events.length ? g.streak + 1 : 0;
    const ev = { piece: p, r, c, res, dmg: res.dmg, killed: false, waveWon: false, runWon: false, gate: false, stuck: false };
    g.hp = Math.max(0, g.hp - res.dmg);
    g.score += res.dmg; g.totalDmg += res.dmg; g.waveDmg += res.dmg;
    g.bestHit = Math.max(g.bestHit, res.dmg);
    if (g.hp <= 0) {
      ev.killed = true;
      g.wavesWon++;
      if (!g.daily && g.wavesWon >= FIRST_RUN_WAVES && !g.endlessOn) { // 每局守住 3 波算赢，之后可以继续守
        g.phase = 'won'; ev.runWon = true; g.over = true; g.won = true; g.reason = 'win';
        return ev;
      }
      g.phase = 'choose';
      g.offer = makeOffer(g);
      return ev;
    }
    if (!g.hand.some(Boolean)) {
      if (g.round >= ROUNDS) {
        g.over = true; g.reason = 'gate'; ev.gate = true;
        return ev;
      }
      g.round++;
      g.moveStar();
      g.newRound();
    }
    if (g.stuck()) { g.over = true; g.reason = 'stuck'; ev.stuck = true; }
    return ev;
  };
  // 三选一拿了一件（或升级）
  g.pick = (id) => {
    if (g.phase !== 'choose') return;
    const have = g.relics.find((r) => r.id === id);
    if (have) have.lv = Math.min(3, have.lv + 1);
    else if (g.relics.length < SLOTS) g.relics.push({ id, lv: 1 });
    g.offer = null;
    if (g.openingPick) { g.openingPick = false; g.phase = 'play'; return; } // 开局那一次不换波
    g.nextWave();
  };
  g.nextWave = () => {
    g.wave++;
    const w = WAVES[g.wave] || { name: '重车', hp: Math.round(WAVES[WAVES.length - 1].hp * Math.pow(1.4, g.wave - WAVES.length + 1)) };
    g.waveDef = w; g.hp = Math.round(w.hp * g.hpScale); g.hpMax = g.hp; g.round = 1; g.waveDmg = 0;
    g.phase = 'play';
    // 手上还剩的块留着；手空了就发新的一轮
    if (!g.hand.some(Boolean)) { g.moveStar(); g.newRound(); }
    if (g.stuck()) { g.over = true; g.reason = 'stuck'; }
  };
  // 守住 3 波以后「继续守」
  g.continueRun = () => {
    g.endlessOn = true; g.over = false; g.won = false; g.reason = null;
    g.phase = 'choose'; g.offer = makeOffer(g);
  };
  // 假广告复活：城破 → 多打一轮；堵死 → 清空中宫再发
  const baseRevive = g.revive;
  g.revive = () => {
    if (g.reason === 'gate') {
      g.adsUsed++;
      g.round--; g.over = false; g.reason = null;
      g.moveStar(); g.newRound();
    } else baseRevive();
  };
  g.nearMiss = () => !g.won && g.reason === 'gate' && g.hp <= g.hpMax * 0.3;
  g.lvOf = (id) => lv(g, id);
  // 开局：第一局先打一辆车再选；以后开局先三选一
  // 开局先挑一件：玩过 3 局以后才有（之前都是空手开局，打掉车才拿）
  if (!o.tutorial && !o.noRelics && !o.relics && g.runNo >= 3) { g.phase = 'choose'; g.offer = makeOffer(g); g.openingPick = true; }
  return g;
}

// 三选一：第一局固定连弩 / 火雷 / 墨斗；之后随机，偏向「能和已有的连上」和升级。机关栏满了只出升级
function makeOffer(g) {
  // 第一局：打掉第 1 辆车只送连弩一件；打掉第 2 辆，在墨斗和火雷里挑一件
  if (g.firstRun && g.wavesWon === 1 && !g.relics.length) return ['crossbow'];
  if (g.firstRun && g.wavesWon === 2) return ['inkline', 'thunder'];
  const owned = g.relics.map((r) => r.id);
  const open = POOL_BY_RUN[g.runNo] || RELIC_IDS;
  let pool = open.filter((id) => (owned.includes(id) ? lv(g, id) < 3 : owned.length < SLOTS));
  // 每日一城：每一波的三选一按日期和第几波定，人人一样（不按各人拿过什么调权重）
  const rnd = g.daily ? core.rng(((g.daily ^ ((g.wavesWon + 1) * 40503)) * 2246822519) >>> 0) : g.rand;
  const weight = g.daily ? () => 1 : (id) => {
    let w = 1;
    if (owned.includes(id)) w += 0.6;
    if (owned.some((o2) => RELICS[o2].pal.includes(id))) w += 1.2;
    return w;
  };
  const out = [];
  while (out.length < (g.daily ? 3 : offerCount(g.runNo)) && pool.length) {
    const tot = pool.reduce((a, id) => a + weight(id), 0);
    let t = rnd() * tot;
    let k = 0;
    while (k < pool.length - 1 && t > weight(pool[k])) { t -= weight(pool[k]); k++; }
    out.push(pool[k]);
    pool = pool.filter((x) => x !== pool[k]);
  }
  return out;
}
// 卡上写「配你的 XX」
function palOf(g, id) {
  const mate = g.relics.find((r) => RELICS[r.id].pal.includes(id) || RELICS[id].pal.includes(r.id));
  return mate ? RELICS[mate.id].name : null;
}

// ---------- 机器人：按手里的机关挑落点 ----------
function bestMove(g, skill) {
  const st = g.state();
  const cands = [];
  g.hand.forEach((p, i) => {
    if (!p) return;
    for (const [r, c] of core.placements(g.board, p)) {
      const res = resolve(g.board, st, p, r, c);
      // 伤害要紧，但别把盘面堆死；离城门越近越看重伤害
      const urgency = 0.35 + (g.round / ROUNDS) * 0.5;
      let v = res.dmg * urgency + res.events.length * 4 + core.evalBoard(res.board, null);
      // 有飞星就往星那宫凑，有五居中 / 河图就往中宫凑
      if (lv(g, 'star')) v += countBlocks(res.board, boxCells(g.starBox)) * 0.6;
      if (lv(g, 'center5') || lv(g, 'hetu')) v += countBlocks(res.board, boxCells(4)) * 0.5;
      cands.push({ i, r, c, v, board: res.board });
    }
  });
  if (!cands.length) return null;
  cands.sort((a, b) => b.v - a.v);
  const top = cands.slice(0, 10);
  for (const m of top) {
    const rest = g.hand.filter((p, k) => p && k !== m.i);
    if (rest.length && !core.solvable(m.board, rest)) m.v -= 100;
  }
  top.sort((a, b) => b.v - a.v);
  const s = skill === undefined ? 1 : skill;
  if (s >= 1 || g.rand() < s) return top[0];
  return top[Math.min(top.length - 1, 1 + Math.floor(g.rand() * 4))];
}
// 机器人三选一：有能连上的先拿能连上的，再升级
function bestPick(g, prefer) {
  if (prefer) { const hit = g.offer.find((id) => prefer.includes(id)); if (hit) return hit; }
  const owned = g.relics.map((r) => r.id);
  const score = (id) => (owned.some((o2) => RELICS[o2].pal.includes(id)) ? 2 : 0) + (owned.includes(id) ? 1 : 0) + g.rand() * 0.1;
  return g.offer.slice().sort((a, b) => score(b) - score(a))[0];
}
// 模拟一局。opts.pick：'none' 不拿 / 'auto' / 数组＝优先拿这几件
function simulate(opts) {
  const o = Object.assign({ skill: 1, secPerMove: () => 3 }, opts);
  const g = createSiege(o);
  let guard = 0;
  while (!g.over && guard++ < 400) {
    if (g.phase === 'choose') {
      if (o.pick === 'none') { g.offer = null; if (g.openingPick) { g.openingPick = false; g.phase = 'play'; } else g.nextWave(); continue; }
      g.pick(bestPick(g, Array.isArray(o.pick) ? o.pick : null));
      continue;
    }
    const m = bestMove(g, o.skill);
    if (!m) break;
    g.elapsed += o.secPerMove(g);
    g.place(m.i, m.r, m.c);
    if (o.maxWaves && g.wavesWon >= o.maxWaves) break;
  }
  return g;
}

module.exports = { POOL_BY_RUN, WAVES, FIRST_RUN_WAVES, ROUNDS, SLOTS, RELICS, RELIC_IDS, STAR_PATH, resolve, createSiege, makeOffer, palOf, bestMove, bestPick, simulate };
